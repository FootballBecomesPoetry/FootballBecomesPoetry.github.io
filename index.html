    excerpt: "For most football is a game of passion, aggression, fight and grit — but for one it was more than that: it was a game of joy, an escape from reality.",
    content: `For most football is a game of passion, a game of aggression, fight, and grit, but for one it was more than that: it was a game of joy, an escape from reality. Like a child holding a controller, constantly flicking the right-analogue stick to see what magical skill they could produce. For one this magical unrealism was reality, because to him, football was freedom, where he touched the pitch, flowers blossomed, he danced an elegant dance that left onlookers in awe. Adored by both home and away fans alike, those who had the privilege to watch him shine for 90 minutes, were left simply mesmerised, because for those 90-minutes, those who saw football as a game of passion fight and aggression, were set free to enjoy the Garden of Eden.

Eden Hazard had the ability to transform a stadium's atmosphere, he played with a smile on his face and forced a smile out of even the most hard-headed supporter. The Belgian Wizard who weaved his way so eloquently and effortlessly through defences, found a way to create an often-incomprehensible beautiful art piece from the most blank canvas. He often defied logic or belief; however, such experience became such a common phenomenon, that he made the impossible a normality, a masterpiece that could simply only be described as the Eden Hazard Experience. While exuding an air of nonchalance, and with a low centre of gravity, he did things with a football that were special. This 5'9 prince bloomed and his garden flourished. A garden that would one day become known to be, "The Garden of Eden". Beginning his career in the historically rich French city of Lille, Hazard made a name for himself playing in the French top division. This is where the magician would wave his wand for the first time, guiding Lille to a French league and cup double, winning their first league title in over 60 years. Hazard was subsequently named the Ligue 1 player of the season, becoming the youngest player to receive the award at just 20 years old. However, Lille merely planted the seeds in the soil for what was to follow. This mesmerising spell at boyhood club Lille earned Hazard a move to one of England's top clubs in Chelsea Football Club, whom of which, following a disappointing season in the premier league, rose to the top of the pile of Europe's elites, to be crowned champions of Europe for the first time in the clubs history. Hazard announced his move to the Kings of the Kings Road in iconic fashion, tweeting "I will be joining the champions of Europe" on his social media.

Despite coming off arguably the greatest achievement in the club's long history, Chelsea was a club in dire need of a rebuild. With a severely ageing squad and unsettled management, who better to spearhead the blues revival than the generational talent from the streets of France? On the 4th of June 2012 it was confirmed. Eden Michael Hazard was joining Chelsea Football Club. Both club and player had no idea what they were going to achieve together, but it was a match made in heaven. From the former greats of Zola, Lampard and Drogba, Chelsea fans had been spoilt when it came to entertainment displayed at the Bridge.

However, none of the aforementioned dazzled in the same way that Eden did, there was something different about this 21-year-old Belgian. With a refreshing, yet calming arrogance, Hazard played with no fear, "give me the ball and I will win us this game". A belief not only held by Eden himself but by teammates and supporters alike. And he did just that, on many occasions single handily, Hazard waltzed his way through opposition defences, contributing to 202 goals during his spell at Chelsea, scoring 110 and assisting 92, picking up 62 'man of the match' awards. A total that amounts to a MOTM award in 25% of all his Chelsea appearances. Eden Hazard arrived in a period where Chelsea needed a saviour and he became just that, winning the club: two Premier League titles, two Europa League titles, an FA Cup and a Carling Cup, all while picking up a plethora of individual awards.

Hazard won all the trophies he did with the same joy of which he began his career, because to some football is a game of aggression and fight but to Eden, it was freedom. The feeling Hazard gave to Chelsea could not be quantified; he revived a dormant feeling amongst the Chelsea fans and entertained varying generations of football fans worldwide. He began with simply the seeds set in the soil, but following seven marvellous years at the club, he left, laying in a picturesque, graceful garden of bloom. Each blade a metaphor for Chelsea supporter lives he changed. Eden Hazard was not simply a player who wore blue, but he bled blue as he danced on the green. His name will forever rest tranquil, in the Garden of Eden.`
  }

function getRoute() {
  const hash = window.location.hash.replace('#', '') || 'home';
  if (hash === 'home' || hash === '') return { view: 'home' };
  if (hash.startsWith('category/')) return { view: 'category', slug: hash.split('/')[1] };
  if (hash.startsWith('post/')) return { view: 'post', slug: hash.split('/')[1] };
  if (hash === 'about') return { view: 'home', scroll: 'about' };
  return { view: 'home' };
}

function navigate(hash) {
  window.location.hash = hash;
  window.scrollTo(0, 0);
}

function formatDate(str) {
  const [y, m, d] = str.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}

function sortedPosts() {
  return [...POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));
}

    app.innerHTML = renderCategory(route.slug);
  } else if (route.view === 'post') {
    app.innerHTML = renderPost(route.slug);
  }

  bindEvents();
}

// ============================================================
//  CATEGORY VIEW
// ============================================================
function renderCategory(slug) {
  const label = CAT_LABELS[slug] || 'Posts';
  const posts = sortedPosts().filter(p => p.category === slug);

  const cards = posts.length === 0
    ? `<p class="empty-msg">No posts in this category yet. Check back soon.</p>`
    : posts.map(p => `
      <article class="list-card" onclick="navigate('post/${p.id}')" style="cursor:pointer;">
        <div class="list-card-meta">
          <span class="post-tag">${CAT_LABELS[p.category]}</span>
          <span class="list-date">${formatDate(p.date)}</span>
        </div>
        <h2 class="list-title">${p.title}</h2>
        <p class="list-excerpt">${p.excerpt}</p>
        <span class="cat-link">Read More</span>
      </article>`).join('');

  return `
  ${renderNav()}
  <div class="page-header">
    <div class="page-header-inner">
      <a href="#home" class="back-link">← Home</a>
      <p class="section-label" style="margin-top:1rem;">${posts.length} ${posts.length === 1 ? 'Post' : 'Posts'}</p>
      <h1 class="page-title">${label}</h1>
      <div class="section-rule"></div>
    </div>
  </div>
  <div class="list-container">
    ${cards}
  </div>
  ${renderFooter()}`;
}

// ============================================================
//  POST VIEW
// ============================================================
function renderPost(slug) {
  const post = POSTS.find(p => p.id === slug);
  if (!post) return `${renderNav()}<div style="padding:8rem 4rem;text-align:center;"><h2>Post not found.</h2><a href="#home" class="btn-primary" style="margin-top:2rem;display:inline-flex;">Go Home</a></div>${renderFooter()}`;

  const paragraphs = post.content.split('\n\n').map(p => `<p>${p.trim()}</p>`).join('');

  const otherPosts = sortedPosts().filter(p => p.id !== slug).slice(0, 2);
  const moreCards = otherPosts.length ? `
    <div class="more-posts">
      <p class="section-label">More Reading</p>
      <h3 class="section-title" style="font-size:1.6rem;">Keep Reading</h3>
      <div class="section-rule"></div>
      <div class="more-grid">
        ${otherPosts.map(p => `
          <article class="list-card" onclick="navigate('post/${p.id}')" style="cursor:pointer;">
            <div class="list-card-meta">
              <span class="post-tag">${CAT_LABELS[p.category]}</span>
              <span class="list-date">${formatDate(p.date)}</span>
            </div>
            <h2 class="list-title">${p.title}</h2>
            <p class="list-excerpt">${p.excerpt}</p>
            <span class="cat-link">Read More</span>
          </article>`).join('')}
      </div>
    </div>` : '';

  return `
  ${renderNav()}
  <div class="post-hero">
    <div class="post-hero-inner">
      <a href="#category/${post.category}" class="back-link">← ${CAT_LABELS[post.category]}</a>
      <p class="post-tag" style="margin-top:1.2rem;">${CAT_LABELS[post.category]}</p>
      <h1 class="post-hero-title">${post.title}</h1>
      <p class="post-hero-date">${formatDate(post.date)}</p>
    </div>
  </div>
  <div class="post-body">
    <div class="post-content">
      ${paragraphs}
    </div>
    ${moreCards}
  </div>
  ${renderFooter()}`;
}

  return `
  <nav>

    <ul class="nav-links">
      <li><a href="#home">Home</a></li>

      <li><a href="#category/general">General Pieces</a></li>
      <li><a href="#category/rising">Rising Stars</a></li>

  </nav>`;
}

function renderFooter() {
  return `
  <footer>
    <div class="footer-logo">When Football Becomes <span>Poetry</span></div>
    <p>© ${new Date().getFullYear()} Noah Mbolokele. All rights reserved.</p>
    <div class="footer-links">
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="mailto:Noahmbolokele@hotmail.com">Email</a>
    </div>
  </footer>`;
}

function bindEvents() {
  // Intercept all hash-link clicks for smooth SPA navigation
  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener('click', () => { setTimeout(render, 10); });
  });
}

window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);
</script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #0e0c0a;
    --paper: #f5f0e8;
    --cream: #ede7d5;
    --gold: #b8955a;
    --gold-light: #d4b07a;
    --grass: #1a3a2a;
    --muted: #7a7060;
    --rule: rgba(14,12,10,0.12);
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Libre Baskerville', Georgia, serif;
    overflow-x: hidden;
  }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.2rem 3rem;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
  }
  .nav-logo {
    font-family: 'Playfair Display', serif;
    font-style: italic; font-size: 1.1rem; font-weight: 700;
    color: var(--ink); text-decoration: none;
    letter-spacing: -0.01em; line-height: 1.2;
  }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    font-family: 'DM Mono', monospace; font-size: 0.72rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted); text-decoration: none; transition: color 0.2s;
  }
  .nav-links a:hover { color: var(--ink); }

  /* HERO */
  .hero {
    min-height: 100vh; display: grid;
    grid-template-columns: 1fr 1fr;
    padding-top: 5rem; position: relative; overflow: hidden;
  }
  .hero::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 70% 30%, rgba(184,149,90,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 20% 80%, rgba(26,58,42,0.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .hero-pitch-lines {
    position: absolute; right: 0; top: 0; bottom: 0; width: 50%;
    opacity: 0.04; pointer-events: none;
  }
  .hero-pitch-lines svg { width: 100%; height: 100%; }
  .hero-left {
    display: flex; flex-direction: column; justify-content: center;
    padding: 4rem 3rem 4rem 4rem; position: relative; z-index: 1;
  }
  .hero-eyebrow {
    font-family: 'DM Mono', monospace; font-size: 0.7rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 1.5rem;
    animation: fadeUp 0.9s 0.2s ease both;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 5vw, 5.5rem); font-weight: 900;
    line-height: 1.02; letter-spacing: -0.03em; margin-bottom: 1rem;
    animation: fadeUp 0.9s 0.35s ease both;
  }
  .hero-title em { font-style: italic; color: var(--gold); display: block; }
  .hero-divider {
    width: 3rem; height: 2px; background: var(--gold); margin: 1.8rem 0;
    animation: fadeUp 0.9s 0.5s ease both;
  }
  .hero-desc {
    font-size: 1.05rem; line-height: 1.75; color: #5a4f42;
    max-width: 38ch; animation: fadeUp 0.9s 0.65s ease both;
  }
  .hero-cta {
    display: flex; gap: 1rem; margin-top: 2.5rem;
    animation: fadeUp 0.9s 0.8s ease both;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    background: var(--ink); color: var(--paper);
    padding: 0.85rem 1.8rem; font-family: 'DM Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; transition: background 0.2s, transform 0.15s; border: none; cursor: pointer;
  }
  .btn-primary:hover { background: var(--grass); transform: translateY(-1px); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 0.5rem;
    border: 1px solid var(--ink); color: var(--ink);
    padding: 0.85rem 1.8rem; font-family: 'DM Mono', monospace;
    font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
    text-decoration: none; transition: background 0.2s;
  }
  .btn-secondary:hover { background: var(--cream); }
  .hero-right {
    display: flex; align-items: center; justify-content: center;
    padding: 4rem 3rem; position: relative;
    animation: fadeIn 1.2s 0.4s ease both;
  }
  .hero-quote-card {
    background: var(--ink); color: var(--paper);
    padding: 3rem; max-width: 420px; position: relative;
  }
  .hero-quote-card::before {
    content: '\201C'; font-family: 'Playfair Display', serif;
    font-size: 8rem; line-height: 0.7; color: var(--gold); opacity: 0.3;
    position: absolute; top: 1.5rem; left: 1.5rem;
  }
  .hero-quote-text {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 1.25rem; line-height: 1.65;
    position: relative; z-index: 1; margin-bottom: 1.5rem;
  }
  .hero-quote-meta {
    font-family: 'DM Mono', monospace; font-size: 0.68rem;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-light);
  }
  .hero-scroll-hint {
    position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%);
    font-family: 'DM Mono', monospace; font-size: 0.65rem;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
    animation: fadeUp 1s 1.2s ease both;
  }
  .scroll-line {
    width: 1px; height: 2rem;
    background: linear-gradient(to bottom, var(--gold), transparent);
    animation: scrollPulse 2s infinite;
  }

  /* MARQUEE */
  .marquee-wrap {
    background: var(--grass); color: var(--gold-light);
    padding: 0.9rem 0; overflow: hidden; white-space: nowrap;
  }
  .marquee-track {
    display: inline-flex; gap: 0;
    animation: marquee 30s linear infinite;
  }
  .marquee-item {
    font-family: 'DM Mono', monospace; font-size: 0.72rem;
    letter-spacing: 0.1em; text-transform: uppercase; padding: 0 2.5rem;
  }
  .marquee-item::after {
    content: '\25C6'; margin-left: 2.5rem; color: var(--gold); opacity: 0.5;
  }

  /* SECTION COMMON */
  section { padding: 6rem 4rem; }
  .section-label {
    font-family: 'DM Mono', monospace; font-size: 0.68rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gold); margin-bottom: 0.8rem;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 3.5vw, 3rem); font-weight: 900;
    line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 1rem;
  }
  .section-rule {
    width: 2.5rem; height: 2px; background: var(--gold); margin-bottom: 2.5rem;
  }

  /* CATEGORIES */
  .categories { background: var(--cream); }
  .categories-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
  .cat-card {
    background: var(--paper); padding: 2.5rem 2rem;
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative; overflow: hidden;
  }
  .cat-card::before {
    content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px;
    background: var(--gold); transform: scaleX(0); transform-origin: left;
    transition: transform 0.3s ease;
  }
  .cat-card:hover::before { transform: scaleX(1); }
  .cat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(0,0,0,0.08); }
  .cat-icon { font-size: 2rem; margin-bottom: 1.2rem; }
  .cat-num {
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 4rem; font-weight: 900; color: var(--rule);
    position: absolute; top: 1rem; right: 1.5rem; line-height: 1; pointer-events: none;
  }
  .cat-title {
    font-family: 'Playfair Display', serif; font-size: 1.35rem;
    font-weight: 700; margin-bottom: 0.8rem;
  }
  .cat-desc { font-size: 0.88rem; line-height: 1.65; color: var(--muted); }
  .cat-link {
    display: inline-flex; align-items: center; gap: 0.4rem;
    font-family: 'DM Mono', monospace; font-size: 0.68rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink);
    text-decoration: none; margin-top: 1.5rem;
    border-bottom: 1px solid var(--ink); padding-bottom: 1px;
    transition: color 0.2s, border-color 0.2s;
  }
  .cat-link:hover, a.cat-link:hover { color: var(--gold); border-color: var(--gold); }

  /* FEATURED / RECENT */
  .featured { background: var(--ink); color: var(--paper); }
  .featured .section-title { color: var(--paper); }
  .featured .section-rule { background: var(--gold); }
  .featured-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 1.5rem; margin-top: 3rem; }
  .post-card {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07);
    padding: 2rem; transition: background 0.25s;
  }
  .post-card:hover { background: rgba(255,255,255,0.09); }
  .post-tag {
    font-family: 'DM Mono', monospace; font-size: 0.62rem;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold-light); margin-bottom: 1rem;
  }
  .post-title {
    font-family: 'Playfair Display', serif; font-weight: 700;
    line-height: 1.3; margin-bottom: 0.8rem;
  }
  .post-card.large .post-title { font-size: 1.5rem; }
  .post-card:not(.large) .post-title { font-size: 1.1rem; }
  .post-excerpt { font-size: 0.88rem; line-height: 1.6; color: rgba(245,240,232,0.6); margin-bottom: 1.2rem; }
  .post-meta { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.08em; color: rgba(245,240,232,0.35); }

  /* ABOUT */
  .about { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
  .about-photo-frame {
    background: var(--ink); aspect-ratio: 3/4; max-width: 380px;
    position: relative; overflow: hidden;
  }
  .about-photo-placeholder {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--grass) 0%, #0a1f15 100%);
    font-family: 'Playfair Display', serif; font-style: italic;
    font-size: 5rem; color: rgba(184,149,90,0.3);
  }
  .about-photo { position: relative; }
  .about-photo-offset {
    position: absolute; bottom: -1.5rem; right: -1.5rem;
    width: 60%; height: 40%; border: 2px solid var(--gold); pointer-events: none;
  }
  .about-text p { font-size: 1rem; line-height: 1.8; color: #6b5f52; margin-bottom: 1.2rem; }
  .about-stats { display: flex; gap: 2.5rem; margin: 2rem 0; padding: 2rem 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .stat-val { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 900; }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  /* NEWSLETTER / CONTACT */
  .newsletter { background: var(--gold); color: var(--ink); text-align: center; padding: 5rem 4rem; }
  .newsletter .section-label { color: var(--ink); opacity: 0.6; }
  .newsletter .section-title { color: var(--ink); }
  .newsletter p { font-size: 1rem; line-height: 1.7; max-width: 48ch; margin: 0 auto 2.5rem; color: rgba(14,12,10,0.75); }

  /* FOOTER */
  footer {
    background: var(--ink); color: rgba(245,240,232,0.5);
    padding: 3rem 4rem; display: flex; align-items: center; justify-content: space-between;
  }
  .footer-logo { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1rem; color: var(--paper); }
  .footer-logo span { color: var(--gold); }
  footer p { font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.08em; }
  .footer-links { display: flex; gap: 1.5rem; }
  .footer-links a {
    font-family: 'DM Mono', monospace; font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: rgba(245,240,232,0.45); text-decoration: none; transition: color 0.2s;
  }
  .footer-links a:hover { color: var(--gold-light); }

  /* PAGE HEADER (category pages) */
  .page-header { background: var(--ink); color: var(--paper); padding: 8rem 4rem 4rem; }
  .page-header-inner { max-width: 800px; }
  .page-title {
    font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 5vw, 4rem);
    font-weight: 900; line-height: 1.05; letter-spacing: -0.03em; color: var(--paper);
  }
  .page-header .section-rule { background: var(--gold); }
  .back-link {
    font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--gold-light); text-decoration: none;
    transition: color 0.2s;
  }
  .back-link:hover { color: var(--paper); }

  /* LIST VIEW */
  .list-container { max-width: 860px; margin: 0 auto; padding: 4rem 4rem 6rem; }
  .list-card {
    padding: 2.5rem 0; border-bottom: 1px solid var(--rule);
    transition: background 0.15s;
  }
  .list-card:last-child { border-bottom: none; }
  .list-card:hover { background: rgba(184,149,90,0.04); padding-left: 0.5rem; transition: padding 0.2s, background 0.2s; }
  .list-card-meta { display: flex; align-items: center; gap: 1.2rem; margin-bottom: 0.8rem; }
  .list-card .post-tag { margin-bottom: 0; }
  .list-date { font-family: 'DM Mono', monospace; font-size: 0.62rem; letter-spacing: 0.08em; color: var(--muted); }
  .list-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; line-height: 1.25; margin-bottom: 0.7rem; }
  .list-excerpt { font-size: 0.92rem; line-height: 1.65; color: var(--muted); margin-bottom: 1rem; }
  .empty-msg { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--muted); padding: 3rem 0; }

  /* POST VIEW */
  .post-hero { background: var(--ink); color: var(--paper); padding: 8rem 4rem 4rem; }
  .post-hero-inner { max-width: 760px; margin: 0 auto; }
  .post-hero-title {
    font-family: 'Playfair Display', serif; font-size: clamp(2rem, 4vw, 3.5rem);
    font-weight: 900; line-height: 1.1; letter-spacing: -0.025em;
    color: var(--paper); margin: 1rem 0 0.8rem;
  }
  .post-hero-date { font-family: 'DM Mono', monospace; font-size: 0.68rem; letter-spacing: 0.12em; color: var(--gold-light); }
  .post-body { max-width: 760px; margin: 0 auto; padding: 4rem 4rem 6rem; }
  .post-content p {
    font-size: 1.05rem; line-height: 1.85; color: #2a2520;
    margin-bottom: 1.6rem;
  }
  .more-posts { margin-top: 5rem; padding-top: 4rem; border-top: 1px solid var(--rule); }
  .more-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2rem; }
  .more-grid .list-title { font-size: 1.15rem; }

  /* ANIMATIONS */
  @keyframes fadeDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeUp   { from { opacity:0; transform:translateY(20px);  } to { opacity:1; transform:translateY(0); } }
  @keyframes fadeIn   { from { opacity:0; } to { opacity:1; } }
  @keyframes marquee  { from { transform:translateX(0); } to { transform:translateX(-50%); } }
  @keyframes scrollPulse { 0%,100%{opacity:1;transform:scaleY(1);} 50%{opacity:0.4;transform:scaleY(0.6);} }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    .hero { grid-template-columns: 1fr; min-height: auto; }
    .hero-left { padding: 6rem 1.5rem 3rem; }
    .hero-right { padding: 2rem 1.5rem 4rem; }
    .hero-quote-card { max-width: 100%; }
    section { padding: 4rem 1.5rem; }
    .categories-grid { grid-template-columns: 1fr; }
    .about { grid-template-columns: 1fr; gap: 2.5rem; }
    .about-photo-frame { max-width: 100%; aspect-ratio: 4/3; }
    .featured-grid { grid-template-columns: 1fr; }
    footer { flex-direction: column; gap: 1rem; text-align: center; }
    .page-header { padding: 7rem 1.5rem 3rem; }
    .list-container { padding: 2rem 1.5rem 4rem; }
    .post-hero { padding: 7rem 1.5rem 3rem; }
    .post-body { padding: 2rem 1.5rem 4rem; }
    .more-grid { grid-template-columns: 1fr; }
  }
</style>

</head>
