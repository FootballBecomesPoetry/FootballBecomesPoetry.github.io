    id:"garden-of-eden",title:"Garden of Eden",category:"poetic",date:"2025-09-05",
    image:"images/hazard.jpeg",
    excerpt:"For most football is a game of passion, aggression, fight and grit, but for one it was more than that: it was a game of joy, an escape from reality.",
    content:`For most football is a game of passion, a game of aggression, fight, and grit, but for one it was more than that: it was a game of joy, an escape from reality. Like a child holding a controller, constantly flicking the right-analogue stick to see what magical skill they could produce. For one this magical unrealism was reality, because to him, football was freedom, where he touched the pitch, flowers blossomed, he danced an elegant dance that left onlookers in awe. Adored by both home and away fans alike, those who had the privilege to watch him shine for 90 minutes, were left simply mesmerised, because for those 90-minutes, those who saw football as a game of passion fight and aggression, were set free to enjoy the Garden of Eden.

Eden Hazard had the ability to transform a stadium's atmosphere, he played with a smile on his face and forced a smile out of even the most hard-headed supporter. The Belgian Wizard who weaved his way so eloquently and effortlessly through defences, found a way to create an often-incomprehensible beautiful art piece from the most blank canvas. He often defied logic or belief; however, such experience became such a common phenomenon, that he made the impossible a normality, a masterpiece that could simply only be described as the Eden Hazard Experience. While exuding an air of nonchalance, and with a low centre of gravity, he did things with a football that were special. This 5ft 9in prince bloomed and his garden flourished. A garden that would one day become known to be, "The Garden of Eden". Beginning his career in the historically rich French city of Lille, Hazard made a name for himself playing in the French top division. This is where the magician would wave his wand for the first time, guiding Lille to a French league and cup double, winning their first league title in over 60 years. Hazard was subsequently named the Ligue 1 player of the season, becoming the youngest player to receive the award at just 20 years old. However, Lille merely planted the seeds in the soil for what was to follow. This mesmerising spell at boyhood club Lille earned Hazard a move to one of England's top clubs in Chelsea Football Club, whom of which, following a disappointing season in the premier league, rose to the top of the pile of Europe's elites, to be crowned champions of Europe for the first time in the clubs history. Hazard announced his move to the Kings of the Kings Road in iconic fashion, tweeting "I will be joining the champions of Europe" on his social media.

Despite coming off arguably the greatest achievement in the club's long history, Chelsea was a club in dire need of a rebuild. With a severely ageing squad and unsettled management, who better to spearhead the blues revival than the generational talent from the streets of France? On the 4th of June 2012 it was confirmed. Eden Michael Hazard was joining Chelsea Football Club. Both club and player had no idea what they were going to achieve together, but it was a match made in heaven. From the former greats of Zola, Lampard and Drogba, Chelsea fans had been spoilt when it came to entertainment displayed at the Bridge.

However, none of the aforementioned dazzled in the same way that Eden did, there was something different about this 21-year-old Belgian. With a refreshing, yet calming arrogance, Hazard played with no fear, "give me the ball and I will win us this game". A belief not only held by Eden himself but by teammates and supporters alike. And he did just that, on many occasions single handily, Hazard waltzed his way through opposition defences, contributing to 202 goals during his spell at Chelsea, scoring 110 and assisting 92, picking up 62 man of the match awards. A total that amounts to a MOTM award in 25% of all his Chelsea appearances. Eden Hazard arrived in a period where Chelsea needed a saviour and he became just that, winning the club: two Premier League titles, two Europa League titles, an FA Cup and a Carling Cup, all while picking up a plethora of individual awards.

Hazard won all the trophies he did with the same joy of which he began his career, because to some football is a game of aggression and fight but to Eden, it was freedom. The feeling Hazard gave to Chelsea could not be quantified; he revived a dormant feeling amongst the Chelsea fans and entertained varying generations of football fans worldwide. He began with simply the seeds set in the soil, but following seven marvellous years at the club, he left, laying in a picturesque, graceful garden of bloom. Each blade a metaphor for Chelsea supporter lives he changed. Eden Hazard was not simply a player who wore blue, but he bled blue as he danced on the green. His name will forever rest tranquil, in the Garden of Eden.`
  },
  {
    id:"storms-pass",title:"Storms Pass, But Will Always Return",category:"poetic",date:"2025-09-23",
    image:"images/dembele.jpeg",
    excerpt:"It is not the destination that matters, but the journey to reach it that holds the greatest importance. Dark days are common for all in football.",
    content:`It is not the destination that matters, but the journey to reach it that holds the greatest importance. Dark days are common for all, and some say it is ironically rich for footballers, among the highest-paid individuals in the world, to complain of such struggles. Yet, behind the glamour lies years of dedication, months of preparation, hours of training, early mornings, late nights, and sacrifice, all to reach the level of a top-tier athlete, to arrive at a place where one can do what they love most. But that dream is often replaced by years of injuries, months on the sidelines, days in hospital beds, and hours in the physio room. What were once early mornings and late nights spent training become early mornings and late nights filled with doubt and questioning. Why me? What have I done to deserve this? Will my body remain like this forever? Will I ever fulfil my potential? A story far too common in football, a story that has robbed us of witnessing the full development of many generational talents. This is the dark side of football, one fans often ignore because footballers are rich; surely, they have it easy. Who cares if they are constantly injured? They should just get over it. An ignorant narrative that plagues the game. Injuries are a silent storm within the body, creeping, stalking, ripping through muscle and bone, leaving a player's spirit adrift in the Pacific Ocean of doubt. Each setback whispers in the ear: "Give up. I will always be here. You will never fully recover." Many unfortunate souls are consumed by these whispers. But for some, within the darkness remains a fragile seed of resilience, waiting to blossom once the storm has passed.

For Ousmane Dembele, that storm has passed. And that fragile seed has now produced a Balon d'Or, a testament to strength, determination, and drive. A defiance against the months on the sidelines and days in the physio room. What once seemed like a tree starved of sunlight and rainwater has now become a rainforest of greatness. Ousmane has arrived, and it could not be more deserved.

His career began in Rennes, the capital of Brittany in northwestern France, a region more famous for its medieval charm and culture. But in 2015, it witnessed the rise of a modern flair, foreign to its modest historic streets. Like a flash of lightning, a young French talent burst onto the scene, scoring 12 goals in 26 matches. A drop of the shoulder and a feint that could confuse a GPS, Dembele married tactful dribbling with explosive pace. Football was witnessing the rise of another potential superstar.

However, this electrifying presence in Rennes was short-lived. The world had taken notice. After a breakout season that earned him Ligue 1 Young Player of the Year, Dembele was picked up by German giants Borussia Dortmund. With a lethal left foot and a devastating right to complement it, Dembele was a unicorn talent, comfortable on either wing, thanks to both feet being strong enough to be considered dominant. Rennes was the interlude; Dortmund unlocked the opening song of the album.

Fearlessness and explosivity were cooked alongside raw natural ability and incredible speed, producing a feast for football fans. During the 2016/17 season, Dembele dazzled again, scoring six goals and assisting 13 in the Bundesliga, guiding Dortmund to the DFB-Pokal trophy with a semi-final goal against Bayern Munich and a final goal against Frankfurt. He played with chaotic elegance and unpredictability, dancing through defenders and often combining with Pierre-Emerick Aubameyang. A season that stamped Dembele's name among Europe's emerging talents. But once again, as was the case in Rennes, the food chain has a natural order and the predators came calling. Dortmund fell victim to the might of Barcelona. Dembouz was hot property, seemingly granting only one-year tenancies to clubs awaiting his services. In August 2017, he made the move from Die Schwarzgelben to La Blaugrana in a staggering 148 million euro transfer.

Often, tides rise with unstoppable momentum. But tides can also surge too quickly and dissipate. For Ousmane Dembele, his wave came crashing down soon after arriving in Barcelona. Despite a respectable 40 goals and 43 assists in 185 appearances, winning three league titles and three Copa del Rey's, he spent 799 days sidelined, the equivalent of two years and 70 days out injured. The result of 15 different injuries that severely hampered the rise of this once-uber talent. And the question lingered: was this another special talent gone to waste? Following a tumultuous and underwhelming spell at Barcelona, both parties agreed it was time to part ways. Dembele returned to France, joining giants PSG in hopes of reviving his career and rediscovering the talent that once made him one of the world's most sought-after youngsters. And so he did. Following a season as supporting cast to fellow French superstar Kylian Mbappe, Dembele's injury woes seemed behind him, missing only three games due to injury. During the 2024/25 season, the once-supporting actor finally landed the lead role. And lead he did. A pressing juggernaut, Ousmane spearheaded PSG's attack, revolutionising the front-man press and striking sheer horror into the souls of defenders across Europe. In 53 matches, he scored 35 goals and assisted 16, winning the quintuple with PSG. This included the Champions League trophy, a feat that had long evaded PSG, even with legends like Ronaldinho, Zlatan Ibrahimovic, Neymar, Mbappe, and Messi. Yet, it was the forgotten talent, Ousmane Dembele, who delivered PSG their historic first Champions League.

Tides may dissipate, but storms will always rise again. Ousmane Dembele is a storm. A force of nature. A denial of disappointment and a deviation from the norm. An inspiration to those enduring years of injury, months on the sidelines, and days in the physio room. A statement that injuries do not define you. The whispers telling you to give up, no matter how loud, have no voice at all. Your tide will rise again. Because Ousmane Dembele is a Balon d'Or winner. And he did it with the pain and sadness that came with his journey.

Ousmane. Balon d'Or.`
  },
  {
    id:"greatest-showman",title:"The Greatest Showman",category:"poetic",date:"2025-10-03",
    image:"images/mourinho.jpeg",
    excerpt:"The jewel in the crown that glimmers far brighter than all others. The single star that shines bright, even as the clouds swallow the sky.",
    content:`The jewel in the crown that glimmers far brighter than all others. The single star that shines bright, even as the clouds swallow the sky. Like a fire in a room of shadows, special by name, special by nature.

Greatness is a term loosely used in today's world, yet greatness remains an understatement to truly crown the brilliance this man brought to the game. A charismatic, exuberant show of arrogance, the perfect imperfection. Football is a game flooded with personality; however, this far exceeded all predecessors. An asteroid had struck the footballing world, and the incumbent fossils that plagued the game with boring and generic approaches to management were about to witness their first big bang. False prophets are prevalent, those sheep in the clothing of wolves, but this was no sheep; this was indeed a ravenous wolf, hungry with a sheer desire to fulfil his hunts. This was no false prophet; this was the truth. The special one had arrived, and his name was Jose Mourinho.

Beginning his career as an interpreter for the late great Sir Bobby Robson, it was clear Jose's understanding of the game was built on strong foundations. Mourinho would then go on to become a coaching assistant for Robson and later Louis van Gaal, assisting in coaching a Barcelona side that included the likes of Pep Guardiola and Luis Enrique. However, it remained clear that Mourinho's future was not confined simply to a role on the coaching staff; this was a great footballing mind ready to explode. A well-nurtured and learned coach, who had played understudy to some of football's greatest. Yet it was time for the student to become master. Following brief managerial spells at Benfica and Leiria, it was Porto where Jose would announce himself to the world. How poetic, still in his managerial infancy, only three years into first-team management, Jose would go on to shock the world, winning a UEFA Champions League trophy with heavy underdogs, Porto.

Trophies are often coined the currency in football, and there is no trophy in club football that grants greater wealth than the Champions League. This monumental feat did not go unnoticed. There was a particular London club on the rise, who had been taken over by Russian billionaire Roman Abramovich, who dreamt of creating a West-London dynasty. Who better to spearhead a fast-track of Chelsea into the list of European elites than the man proven to do just that? The marriage between Chelsea and Jose Mourinho was destiny and was officially signed off. The special one had arrived in England, a land plagued with the dominance of two spectacular figures. The King in the North, Sir Alex Ferguson of House Old Trafford, and the French King in the South, Arsene Wenger of House Highbury. They held the duopoly in the Premier League, with the prior seven league titles falling to the Mancunians or the North London Reds. However, all eras come to an end, and all periods of dominance need a valiant challenger, and there was no contender more worthy than Mr Mourinho of House Stamford Bridge. The friction between the Premier League's two dominant tectonic plates, Jose caused an earthquake that disrupted the natural equilibrium in England. A personality viewed as abrasive to opposing managers, but a personality that inspired and brought belief to West London. A belief that Chelsea no longer had to play victim to the bullies in red. A blue moon was rising, and the wolf that led the pack commanded dominance and built a formidable machine.

86 consecutive home matches unbeaten, 15 league goals conceded in a whole season, most clean sheets kept in a Premier League season (25), and the most points in a Premier League season at the time (95). All records were achieved by Jose on his way to achieving three Premier League titles, including a first in 50 years for Chelsea, as well as one FA Cup and three League Cups. A style that polarised many; unlike the beautiful intricate passing football embodied by Arsenal, or the blistering and clinical counterattacking style of Manchester United, Mourinho prioritised defensive resolution and physicality in attempts to dominate both physically and psychologically the opposing side. The once frail and timid Chelsea side became the league's bullies.

Mourinho built a legacy at Chelsea that remains to this day; a reputation of guaranteed trophy success that followed him throughout his career. Eight league titles across four different leagues in Europe, two Champions Leagues, and sixteen other major trophies, including a completed European trophy set. For most, winning trophies is rare; for Mourinho, winning is a formality, an internal demand for success that filtered through to players and fans alike. A figure that football needed, with a persona that football will likely never experience again. Hated by many, adored by most, a true visionary, strategist, and maestro of a manager. Mourinho will forever be remembered for his impact on football and will forever be revered as the special one. The student became the master.`
  },
  {
    id:"scouse-bully",title:"The Scouse Bully in Manny",category:"poetic",date:"2025-10-17",
    image:"images/rooney.jpeg",
    excerpt:"Although established as King of the Jungle, a lion is not the quickest, nor does it possess the strongest bite force. So what separates the lion from its counterparts?",
    content:`Although established as King of the Jungle, a lion is not the quickest, nor does it possess the strongest bite force. So what separates the lion from its counterparts? The answer is simple: a mixture of it all. A lion is crowned king due to the nature in which it combines power, presence, and preeminence. For the lion need not excel above all others in individual skill, but the use of those skills alone is what defines a lion as the apex predator of its land. Where prey may demonstrate their singular, unique skill, the lion simply roars to remind the jungle who listens and sees all. For a lion may not stand tall, but make no mistake, it is no fool. Composed under pressure, a lion always remains cool.

They do not make them like Wayne these days, a skinhead trim, a rough face, and a fierce gaze. Brute force, Total 90 boots, he sent defences into a craze. An unorthodox look, with the 10 on his back, he never failed to amaze. Rooney was a lion. A lion by definition and by nature, he was not the quickest, the most intelligent, or the greatest finisher around. However, he displayed all these talents, and a multitude of others, to a level at which his ability could not be argued nor denied. Without the cheetah speed of Cristiano or the gazelle agility of Messi, Rooney was a predator in his own way, the Total 90 way.

On 19 October 2002, following his debut for Everton against Tottenham Hotspur, 16-year-old Wayne would feature again. However, this game would not be merely another appearance in the bank for a young, emerging talent. On this autumn Saturday afternoon, Rooney would force all onlookers to take notice, becoming the youngest Premier League goalscorer at 16 years and 360 days with a sumptuous volley from long range against Arsenal. The young Scouse lad playing in Merseyside had fulfilled childhood dreams, becoming a Premier League player and scoring his first senior goal. However, even dreams can be limited in the level of wonder the imagination can conjure, and for young Wayne, what his career was destined for would be beyond even the wildest of dreams.

As a baby eagle must one day leave its father's nest, it was inevitable that Rooney's days at Everton were numbered. The teenager had grown wings and learned to fly far earlier than his years demanded. This early blossoming of Rooney's talent coincided with heavy interest from England's largest club and global football juggernauts in the shape of Manchester United. The red inferno in Manchester was burning fiercely, but Sir Alex still sought a revival in the Theatre of Dreams. With Arsenal competing strongly and the emergence of Jose Mourinho's Chelsea, the Red Dynasty required a rejuvenating spark, and who better to lead the regeneration than the 18-year-old wonderkid Wayne Rooney. The Theatre of Dreams had been set ablaze, Rooney was hot and raring to go. It was time to create the Great Fire of Manchester. And that is exactly what he did, he burned hotter than anyone could fathom. After thirteen years in Manchester, what arrived as a Scouse cub, fierce and fearless, left as a dominant lion, a captain and leader of the pride.

539 appearances, 253 goals, 146 assists, becoming United's all-time top goalscorer, winning five Premier League titles, one FA Cup, three Carling Cups, and one UEFA Champions League medal. Rooney was a bully, a wildfire that fed on the fear of the forest, a shadow that grew larger as the light of defenders shrank. At merely 5ft 9in, Rooney still stood tall and caused havoc and chaos with care. Truly an oxymoron of a player, he could leather a football, striking pure lace into the top corner. In the same vein, he often caressed a cutback pass, finessing the ball as it arrived at his feet into the far corner. Left foot, right foot, free kicks, volleys, and even headers, a true scorer of all types of goals. Wayne scored the goal voted as the greatest Premier League goal of all time with a bicycle kick in the Manchester derby.

Rooney was the definition of he can do it all; create, score, and pass, alongside pure tenacity and defensive contribution on the side. A Swiss army knife at its most elite level of sharpness. Arguably England and the Premier League's greatest player of all time, Wayne Rooney was truly timeless. The lion whose roar alone struck fear into the hearts and minds of defenders, but he was not all bark, no bite. His teeth pierced, and he did not hesitate to strike.

The Scouse bully who arrived in Manchester as a boy left as the nightmare who tortured defences in the Theatre of Dreams.`
  },
  {
    id:"misunderstood-genius",title:"The Misunderstood Genius",category:"poetic",date:"2025-11-14",
    image:"images/pogba.jpeg",
    excerpt:"A ballerina in football's clothing, dancing and sprinkling magic across the pitch, flowing so evidently and elegantly like a swan gliding across calm waters.",
    content:`A ballerina in football's clothing, dancing and sprinkling magic across the pitch, flowing so evidently and elegantly like a swan gliding across calm waters, serene in appearance amidst the chaos left in its trail. For those not born naturally gifted, it is possible that their football may still become poetry; however, for him, the question of natural ability is no question at all. This is a talent that could only be bestowed by God Himself.

For Pogba, his feet were born poetic. They spoke in wonderful rhymes, weaving words and movements together in a way that no other ever had before. A creator, an artist, a painter in every sense. For creativity is not defined solely by a masterful painter stroking a brush across a blank canvas to produce a masterpiece, nor is it limited to a musical artist in a studio crafting rhythmic genius. Creativity is everything that strays from the conventional, that ability to astonish in unimaginable ways, without fear and with pure conviction, a belief in the difference you are able to create.

Paul Pogba was a creator, an artist in the same breath as Mozart or Leonardo da Vinci. He simply did so with a ball at his feet. He saw the game far quicker than his counterparts, enabling him to make the beautiful game look effortless. While those around him opted for rough and rugged playstyles, Pogba possessed the ability to do it all, and with incomparable physicality. He often seamlessly glided across the pitch, shrugging off opponents who looked in awe at what the inventor could produce. In the same vein, he displayed a range of passing that was second to none, left foot, right foot, ten yards or ninety, it was all poetry to Paul.

The tag of generational footballer is often misused and overused; however, there is no exaggeration when it is used to describe Pogba, a unicorn of a footballer who possessed the talent to leave match-goers in a trance. While we currently live in a time where it is difficult to find players who lift you off the edge of your seat, Pogba put bums on seats and filled stadiums. He was a player people would leave home just to watch. He played with an incredible joy, and that joy radiated to all onlookers.

However, the direction football has taken has meant that players such as Pogba were often disrespected or unappreciated by the masses. Yet Pogba is clearly a misunderstood genius, a brilliant maker with a polarising personality, but special nonetheless. Whether it was the relaxed, blonde-tipped Mohican at Juventus, the red Magistas, short sleeves, and black gloves of the dancing superstar in Manchester, or the short-haired, matured Paul in French blue, Pogba marvelled wherever he graced the pitch.

He often did not get the respect he deserved, but this is where football becomes poetry, where geniuses are appreciated for their genius. Football becomes poetry for many, but Paul was born poetic. His name is written, stamped, and confirmed into football history with the same rhythmic splendour with which he played the game.

Paul Pogba, the artist, the painter, the misunderstood genius, a true personification of poetry.`
  },
  {
    id:"prince-never-became-king",title:"The Prince Who Never Became King",category:"poetic",date:"2025-12-12",
    image:"images/neymar.jpeg",
    excerpt:"The path to succession from Prince to King is often straightforward. But what becomes of the Prince in the era of two Kings who have torn the natural order of existence?",
    content:`The path to succession from Prince to King is often straightforward. The next in line is crowned King once he who reigns is no longer fit to rule. However, what becomes of the Prince in the era of two Kings who have torn the natural order of existence and remained dominant over the land long beyond comprehensible tenure? This Prince was not like the other pretenders who once challenged for the throne before him. He was a champion, generational, a showstopper, and a worthy successor to the duopoly that had reigned so supreme.

In the midst of arguably the two greatest aliens to ever grace the sport, a third otherworldly specimen was born. Bursting onto the scene in a fashion foreign to the footballing world, although the two reigning Kings Lionel Messi and Cristiano Ronaldo possessed unfathomable ability, the magic they produced had become familiar. This Prince was unique. The South American flair paired with the European football intelligence he demonstrated brought trickery unlike anything seen before.

The Brazilian story had become all too familiar. A natural and instinctive trickster, yet a far too common tale of unfulfilled potential. However, with this talent there was no doubt. This was a force, but not in the conventional form. This was an unorthodox, exuberant entity, a challenger ready to conquer beyond simply the Brazilian terrains.

In what could be described as one of the golden generations in footballing history, it was fitting for the world to be treated to the 2010s edition of Brazilian generational talents, following in the same vein as Kaka, Ronaldinho and R9. The one kid believed to hold the mantle for the Selecao for the generation to follow. Step forward Neymar Junior, hailing from Mogi das Cruzes, Sao Paulo, whose glimmering light in the potential revival of Brazilian football did not fail to dazzle the masses. From a young age he earned a sponsorship deal with Nike at just 13 years old. It became clear very quickly that Brazil had produced a saviour, something supernatural, and with the correct nurturing his claim to the throne at the pinnacle of football was very real.

In the 2011 to 12 season Neymar announced himself to the world. After breaking through the season prior, he scored 44 goals and provided 17 assists at just 19 years old, guiding boyhood club Santos to a Copa Libertadores with a smile on his face and a tchu tcha tcha in his feet. The kid had arrived and caused destruction all across Brazil. Home was conquered. Next step, the world.

With the eyes of the world tracking Neymar's every move and drifting to his rhythm, the richest owners across the globe caught Neymar fever and fought hard for his signature. After fending off competition from across Europe and after facing Neymar himself in the Club World Cup final, Barcelona became his next destination. The champions of Europe, and more importantly the home of one of the two reigning Kings, Lionel Messi. Where better to keep an emerging threat to your throne than in your shadow?

And that is where Neymar remained. Despite constantly waving his wand and leaving crowds in a trance, the spell he cast was often broken by the incomparable brilliance of Lionel Messi. Yet Neymar's own light still shone brightly, scoring 105 goals and assisting 76 more in only 186 appearances. But the sun will always outshine a lightbulb. During his Barcelona years, the four Ballon d'Ors on offer went to Cristiano Ronaldo three times and Lionel Messi once. The two Kings continued to dominate and somehow trump any perceived threat. For a King to rise from the ashes, he must be working upon fresh land.

The brightest lights always find a way to escape the shadows. The chance for the crownless to be coronated still remained. In search of this glory, the Spanish pastures were left behind and the French streets of Paris called. Free from all shackles and free from the title of the eternal bridesmaid, Paris offered Neymar the opportunity to build his own legacy, fulfil his own destiny, and break free from the name of Prince. It offered him the opportunity to be crowned King.

Once again Neymar shone, but this time even brighter. He set ablaze the dull streets of Paris and made a foreign land his own kingdom. Reaching the peak of his brilliance at PSG, he marvelled every week, left defenders in his wake, and left supporters with mouths wide open at the magic he produced. During his Parisian reign he scored 118 goals and delivered 77 assists in 175 appearances. Performances alongside those at Barcelona cemented Neymar's legacy as one of the greatest to ever play the sport.

Yet the title of undisputed King still eluded him. Winning PSG their first Champions League proved difficult, coming closest in 2020. Once again he fell back into the shadows of the relentless duo, with Messi winning three Ballon d'Ors during Neymar's Paris years and Cristiano Ronaldo winning one.

The Prince who never became King, a title that forever lingered near Neymar, often through little fault of his own and partly due to injuries, and partly because Messi and Ronaldo were simply more alien than human. Neymar remains among the greatest to ever grace the sport and make no mistake, despite not reaching the unquestioned number one spot, the Brazilian remained in a stratosphere above all others. He brought joy, flair and excitement to football that had long been lost.

He was not the Prince who did not become King. Instead he was the Prince who captured the hearts, eyes and rhythm of an entire kingdom. Neymar da Silva Santos Junior, the Prince the kingdom needed.`
  },
  {
    id:"o-renascimento-do-samba",title:"O Renascimento do Samba",category:"rising",date:"2025-10-10",
    image:"images/estevao.jpeg",
    excerpt:"Seasons come and seasons go, but for the Brazilian football crowd, generational talents are expected to be born onto the global stage every few years.",
    content:`Seasons come and seasons go, but for the Brazilian football crowd, generational talents are expected to be born onto the global stage every few years. From the legends of yesteryear such as Neymar, Kaka, Ronaldinho, and R9, to those who defined the early era of football as an international commodity such as Pele, Garrincha, and Jairzinho. The country in which Christ the Redeemer resides has truly been blessed by the footballing gods with some of the greatest talents ever to play the sport.

However, in recent times, the home of elegance and flair that has enticed football fans worldwide has struggled to produce a rightful heir to the crown of the saviour of the Selecao. Since Neymar vacated his seat on the Iron Throne, we have witnessed the emergence of Brazilian superstars such as Vinicius Junior, Raphinha, and Rodrygo, but none have risen to the level required to be ordained as the torchbearer for Brazilian football's newest era. Please step forward, Estevao Willian Almeida de Oliveira Goncalves.

Solar eclipses are a very rare phenomenon, but if you are lucky enough to ever witness such an event, put your shades on and enjoy the show. In an era where shooting stars have been prevalent in Brazilian football's new generation, Estevao is an asteroid and he is ready to create a big bang. Breaking onto the scene at merely sixteen years old at Sao Paulo giants Palmeiras, the kid nicknamed "Messinho" took the Campeonato Brasileiro by storm. The numbers speak for themselves, as he became the player with the most goals and assists before his eighteenth birthday, surpassing his idol and legend Neymar. However, to be in line for the throne, numbers mean very little. Instead, it is the feeling that a player brings, the joy to those watching, and the ability to inspire onlookers that the Selecao will return to the top of the world once more. Estevao has certainly shown signs of restoring that feeling.

Simply a child charged with fulfilling the expectations of Palmeiras fans and coaching staff alike, this was not an ordinary sixteen-year-old talent. Estevao had the trust of all Palmeiras faithful to make things happen, be a game decider, and restore the feeling. And he did just that at the age of seventeen, with a smile on his face. A different talent to that of Neymar, less flair and trickery, but with a similar silk, elegance, and intelligence. Estevao played far beyond his years, and although not possessing the same level of arrogance in his dribble, he, in a similar vein to Neymar, was committed to making a fool of opponents.

    id:"goalkeeping-conundrum",title:"The Goalkeeping Conundrum",category:"general",date:"2026-03-12",
    image:"images/neuer.jpeg",
    excerpt:"Football is at arguably its most interesting place at the moment when it comes to the goalkeeping position.",
    content:`Football is at arguably its most interesting place at the moment when it comes to the goalkeeping position. Long are the days where Manuel Neuer was seen as a goalkeeping revolution due to his sweeper keeper abilities and his high aptitude for playing with the ball at his feet. Prior goalkeepers had minimal impact on a team's possession statistics and seemed to be far more focused on keeping the ball out of the net. The standard goalkeeping role, right?

Fast forward to 2026 and you would be wrong. In particular at top clubs it has almost become a necessity for goalkeepers to be able to play the game with the ball at their feet, to the extent where on certain occasions it is prioritised over what was once deemed the conventional goalkeeping ability of shot stopping. This week's UEFA Champions League fixtures highlighted both the highs and the lows of having a goalkeeper with the ability to pick out a pass. Thibaut Courtois, in a game against Manchester City, was able to pick out Federico Valverde with an incredible long range pass, providing him with an assist for the first goal of a 3 to 0 drubbing and a Federico Valverde masterclass. The true art of having a goalkeeper able to pick out a pass.

However, just 24 hours earlier we saw arguably the worst Champions League goalkeeping performance, rivalled only by Loris Karius, in a match between Atletico Madrid and Tottenham Hotspur, where two astonishing blunders saw Atletico Madrid take a three goal lead and the goalkeeper in question substituted after only sixteen minutes. Tragic. Fast forward another 24 hours and we were once again treated to a reminder of football's current state. Liam Rosenior, the boss of Chelsea, opted to bench number one Robert Sanchez, who had arguably been having his best season since his move to Chelsea, in order to prioritise the ball playing ability of Danish goalkeeper Filip Jorgensen.

And it looked to pay off. Well, only for the first seventy four minutes. The goalkeeper displayed in those first seventy four minutes exactly why ball playing goalkeepers are being prioritised. Slick touches, line breaking passes and fancy flicks. But we are talking about a goalkeeper here, not a number ten or a skilful winger. A goalkeeper.

And it was not long before the Chelsea number one showed exactly what makes him a goalkeeper rather than a Xavi or Andres Iniesta controlling the middle of the park. Whether through overconfidence or sheer incompetence, the goalkeeper attempted to break the lines and instead played the ball straight to a Paris Saint Germain attacker. He was severely punished, gifting PSG a third goal.

This spelled capitulation for Chelsea, who would go on to lose 5 to 2, with the fifth goal coming from yet another goalkeeping blunder. Two high profile games. Two unforgivable mistakes from goalkeepers prioritised for their ball playing ability. But these are goalkeepers, not midfielders, and they should not be treated as such. Filip Jorgensen was the Chelsea player who took the most touches against PSG. Not Cole Palmer. Not Enzo Fernandez. The goalkeeper.

For me this is the biggest issue with football in its current state. We are not getting the best players on the ball. Instead we are prioritising the goalkeeper, a player not good enough to play in midfield, to dictate play.

What is your opinion? Do you believe ball-playing goalkeepers give teams enough of a competitive advantage to justify lacklustre goalkeeping fundamentals?`

    content:`We are witnessing the fall of a once all conquering giant. A club who, alongside Manchester United, dominated English football and stood tall as a poster for the modern era of premier league football. A club with more trophies than any English elite since the turn of the century. A giant stripped of its identity. Once fierce, immovable and, at times, unbeatable.

This is no tale of a mighty Goliath undone by external forces. This giant has been torn apart from within.

Today, Chelsea FC have sacked yet another manager. For many supporters, it felt long overdue. The club have been brutally annihilated by Paris Saint-Germain in the UEFA Champions League, battered across England, and have thrown away what once seemed a reachable goal of returning to Europe's elite. Records many did not even know existed have been broken. Five defeats by three goals in two months. Five consecutive games without scoring, for the first time since the sinking of the Titanic.

The iceberg has returned. And once again, it has cut deep into the heart of Chelsea. This is now a shadow of the side that lifted the Champions League in 2021. A team that once conquered Europe now looks incapable of competing even at youth level, let alone standing among the elite.

So who is to blame?

The fans? Impossible. Their standards have not wavered. Cries of "We want our Chelsea back" echo through Stamford Bridge. A fanbase raised on success now subjected to something closer to a footballing endurance test.

The managers? It is the easiest accusation, but rarely the truest. They arrive in chaos, inherit instability, and are dismissed at the first sign of fracture. They are not the cause. They are the cover.

The owners and directors?

There lies the truth.

Incompetence in its purest form. Arrogance at its loudest. Ignorance, unmistakable. A group who dismantled a machine that worked, a system built to win, in pursuit of unproven ideals. They have cut away at the foundations piece by piece. Five managers in four years. Stability reduced to a myth.

Chelsea did not need an identity shift. It was imposed anyway.
Chelsea knew how to win. It was deemed the wrong way.
Chelsea held the highest standards. The blueprint was burned.

And so a theme emerges, as devastating as it is undeniable.

"Chelsea were."

Because the Chelsea that once existed is no more.

The club that won two Champions Leagues, five Premier Leagues, five FA Cups, two Europa Leagues now feels like a memory rather than a reality. Revival feels distant. The present offers little more than unrest. The meaning of Chelsea Football Club, the gravitas of Stamford Bridge, the pride of the badge all diminished. And the fans are left to carry what remains.

Today, the owners have sacked a manager.
But four years ago, they made a far greater decision.

They began the unravelling of a football club.

The badge still exists.
But what it represents has faded.
What remains is not Chelsea as it was.
Only the shadow of it.`
  }

function getRoute() {
  const hash = window.location.hash.replace("#","") || "home";
  if (hash==="home"||hash==="") return {view:"home"};
  if (hash.startsWith("category/")) return {view:"category",slug:hash.split("/")[1]};
  if (hash.startsWith("post/")) return {view:"post",slug:hash.split("/")[1]};
  if (hash==="gallery") return {view:"gallery"};
  return {view:"home"};
}
function navigate(hash) { window.location.hash=hash; window.scrollTo(0,0); }
function formatDate(str) {
  const [y,m,d]=str.split("-");
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function sortedPosts() { return [...POSTS].sort((a,b)=>new Date(b.date)-new Date(a.date)); }

function render() {
  const route=getRoute();
  const app=document.getElementById("app");
  if (route.view==="home") app.innerHTML=renderHome();
  else if (route.view==="category") app.innerHTML=renderCategory(route.slug);
  else if (route.view==="post") app.innerHTML=renderPost(route.slug);
  else if (route.view==="gallery") app.innerHTML=renderGallery();
  bindEvents();
}

function renderCategory(slug) {
  const label=CAT_LABELS[slug]||"Posts";
  const posts=sortedPosts().filter(p=>p.category===slug);
  const cards=posts.length===0
    ?`<p class="empty-msg">No posts in this category yet.</p>`
    :posts.map(p=>`
      <article class="list-card" onclick="navigate('post/${p.id}')" style="cursor:pointer;">
        ${p.image?`<div class="list-card-img"><img src="${p.image}" alt="${p.title}"/></div>`:"" }
        <div class="list-card-body">
          <div class="list-card-meta"><span class="post-tag">${CAT_LABELS[p.category]}</span><span class="list-date">${formatDate(p.date)}</span></div>
          <h2 class="list-title">${p.title}</h2>
          <p class="list-excerpt">${p.excerpt}</p>
          <span class="cat-link">Read More</span>
        </div>
      </article>`).join("");
  return `
  ${renderNav()}
  <div class="page-header">
    <div class="page-header-inner">
      <a href="#home" class="back-link">← Home</a>
      <p class="section-label" style="margin-top:1rem;">${posts.length} ${posts.length===1?"Post":"Posts"}</p>
      <h1 class="page-title">${label}</h1>
      <div class="section-rule"></div>
    </div>
  </div>
  <div class="list-container">${cards}</div>
  ${renderFooter()}`;
}

function renderPost(slug) {

  if (!post) return `${renderNav()}<div style="padding:8rem 4rem;text-align:center;color:#f5f0e8;"><h2>Post not found.</h2></div>${renderFooter()}`;
  const paragraphs=post.content.split("\n\n").map(p=>`<p>${p.trim()}</p>`).join("");
  const others=sortedPosts().filter(p=>p.id!==slug).slice(0,2);
  const moreCards=others.length?`
    <div class="more-posts">
      <p class="section-label">More Reading</p>
      <h3 class="section-title" style="font-size:1.6rem;color:#f5f0e8;">Keep Reading</h3>
      <div class="section-rule"></div>
      <div class="more-grid">
        ${others.map(p=>`
          <article class="list-card" onclick="navigate('post/${p.id}')" style="cursor:pointer;">
            ${p.image?`<div class="list-card-img"><img src="${p.image}" alt="${p.title}"/></div>`:""}
            <div class="list-card-body">
              <div class="list-card-meta"><span class="post-tag">${CAT_LABELS[p.category]}</span><span class="list-date">${formatDate(p.date)}</span></div>
              <h2 class="list-title">${p.title}</h2>
              <span class="cat-link">Read More</span>
            </div>
          </article>`).join("")}
      </div>
    </div>`:"";
  return `
  ${renderNav()}
  <div class="post-hero" ${post.image?`style="background-image:linear-gradient(to bottom,rgba(14,12,10,0.55) 0%,rgba(14,12,10,0.92) 70%),url(${post.image});background-size:cover;background-position:center top;"`:``}>
    <div class="post-hero-inner">
      <a href="#category/${post.category}" class="back-link">← ${CAT_LABELS[post.category]}</a>
      <p class="post-tag" style="margin-top:1.2rem;">${CAT_LABELS[post.category]}</p>
      <h1 class="post-hero-title">${post.title}</h1>
      <p class="post-hero-date">${formatDate(post.date)}</p>
    </div>
  </div>
  <div class="post-body">
    <div class="post-content">${paragraphs}</div>
    ${moreCards}
  </div>
  ${renderFooter()}`;
}

function renderGallery() {
  return `
  ${renderNav()}
  <div class="page-header">
    <div class="page-header-inner">
      <a href="#home" class="back-link">← Home</a>
      <p class="section-label" style="margin-top:1rem;">${GALLERY.length} Images</p>
      <h1 class="page-title">Gallery</h1>
      <div class="section-rule"></div>
    </div>
  </div>
  <div class="gallery-full">
    <div class="gallery-masonry">
      ${GALLERY.map((g,i)=>`
        <div class="gallery-item" onclick="openLightbox(${i})">
          <img src="${g.src}" alt="${g.caption}"/>
          <div class="gallery-thumb-overlay"><span>${g.caption}</span></div>
        </div>`).join("")}
    </div>
  </div>
  <div id="lightbox" class="lightbox" onclick="closeLightbox()" style="display:none;">
    <div class="lightbox-inner" onclick="event.stopPropagation()">
      <button class="lb-close" onclick="closeLightbox()">✕</button>
      <button class="lb-prev" onclick="lbNav(-1)">‹</button>
      <img id="lb-img" src="" alt=""/>
      <p id="lb-caption" class="lb-caption"></p>
      <button class="lb-next" onclick="lbNav(1)">›</button>
    </div>
  </div>
  ${renderFooter()}`;
}

let lbIndex=0;
function openLightbox(i) {
  lbIndex=i;
  document.getElementById("lb-img").src=GALLERY[i].src;
  document.getElementById("lb-caption").textContent=GALLERY[i].caption;
  document.getElementById("lightbox").style.display="flex";
}
function closeLightbox() { document.getElementById("lightbox").style.display="none"; }
function lbNav(dir) {
  lbIndex=(lbIndex+dir+GALLERY.length)%GALLERY.length;
  document.getElementById("lb-img").src=GALLERY[lbIndex].src;
  document.getElementById("lb-caption").textContent=GALLERY[lbIndex].caption;
}

function renderNav() {
  return `<nav>
    <a href="#home" class="nav-logo">Football Becomes<br><span>Poetry</span></a>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#category/poetic">Poetic Expressions</a></li>
      <li><a href="#category/general">General Pieces</a></li>
      <li><a href="#category/rising">Rising Stars</a></li>
      <li><a href="#gallery">Gallery</a></li>
    </ul>
  </nav>`;
}
function renderFooter() {
  return `<footer>
    <div class="footer-logo">Football Becomes <span>Poetry</span></div>
    <p>© ${new Date().getFullYear()} Noah Mbolokele. All rights reserved.</p>
    <div class="footer-links">
      <a href="https://instagram.com" target="_blank">Instagram</a>
      <a href="mailto:Noahmbolokele@hotmail.com">Email</a>
    </div>
  </footer>`;
}
function bindEvents() {
  document.querySelectorAll('a[href^="#"]').forEach(a=>{
    a.addEventListener("click",()=>setTimeout(render,10));
  });
}
window.addEventListener("hashchange",render);
window.addEventListener("DOMContentLoaded",render);
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#0e0c0a;--paper:#f5f0e8;--cream:#ede7d5;
  --gold:#b8955a;--gold-light:#d4b07a;--grass:#1a3a2a;
  --muted:#7a7060;--rule:rgba(14,12,10,0.12);
}
html{scroll-behavior:smooth;background:#0e0c0a;}
body{background:#0e0c0a;color:#f5f0e8;font-family:'Libre Baskerville',Georgia,serif;overflow-x:hidden;}

nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:1.2rem 3rem;background:#0e0c0a;border-bottom:1px solid rgba(184,149,90,0.15);}
.nav-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:1.1rem;font-weight:700;color:#f5f0e8;text-decoration:none;letter-spacing:-0.01em;line-height:1.2;}
.nav-logo span{color:var(--gold);}
.nav-links{display:flex;gap:2rem;list-style:none;}
.nav-links a{font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,240,232,0.45);text-decoration:none;transition:color 0.2s;}
.nav-links a:hover{color:var(--gold-light);}

.hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;padding-top:5rem;position:relative;overflow:hidden;background:#0e0c0a;}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 70% 30%,rgba(184,149,90,0.07) 0%,transparent 60%),radial-gradient(ellipse at 20% 80%,rgba(184,149,90,0.04) 0%,transparent 50%);pointer-events:none;}
.hero-pitch-lines{position:absolute;right:0;top:0;bottom:0;width:50%;opacity:0.12;pointer-events:none;}
.hero-pitch-lines svg{width:100%;height:100%;}
.hero-left{display:flex;flex-direction:column;justify-content:center;padding:4rem 3rem 4rem 4rem;position:relative;z-index:1;}
.hero-eyebrow{font-family:'DM Mono',monospace;font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:1.5rem;animation:fadeUp 0.9s 0.2s ease both;}
.hero-title{font-family:'Playfair Display',serif;font-size:clamp(3rem,5vw,5.5rem);font-weight:900;line-height:1.02;letter-spacing:-0.03em;margin-bottom:1rem;color:#f5f0e8;animation:fadeUp 0.9s 0.35s ease both;}
.hero-title em{font-style:italic;color:var(--gold);display:block;}
.hero-divider{width:3rem;height:2px;background:var(--gold);margin:1.8rem 0;animation:fadeUp 0.9s 0.5s ease both;}
.hero-desc{font-size:1.05rem;line-height:1.75;color:rgba(245,240,232,0.65);max-width:38ch;animation:fadeUp 0.9s 0.65s ease both;}
.hero-cta{display:flex;gap:1rem;margin-top:2.5rem;animation:fadeUp 0.9s 0.8s ease both;}
.btn-primary{display:inline-flex;align-items:center;gap:0.5rem;background:var(--gold);color:#0e0c0a;padding:0.85rem 1.8rem;font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;transition:background 0.2s,transform 0.15s;border:none;cursor:pointer;font-weight:700;}
.btn-primary:hover{background:var(--gold-light);transform:translateY(-1px);}
.btn-secondary{display:inline-flex;align-items:center;gap:0.5rem;border:1px solid rgba(245,240,232,0.3);color:#f5f0e8;padding:0.85rem 1.8rem;font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;transition:background 0.2s,border-color 0.2s;}
.btn-secondary:hover{background:rgba(255,255,255,0.06);border-color:rgba(245,240,232,0.6);}
.hero-right{display:flex;align-items:center;justify-content:center;padding:4rem 3rem;position:relative;animation:fadeIn 1.2s 0.4s ease both;}
.hero-quote-card{background:rgba(184,149,90,0.08);border:1px solid rgba(184,149,90,0.25);color:#f5f0e8;padding:3rem;max-width:420px;position:relative;}
.hero-quote-card::before{content:'C';font-family:'Playfair Display',serif;font-size:8rem;line-height:0.7;color:var(--gold);opacity:0.25;position:absolute;top:1.5rem;left:1.5rem;}
.hero-quote-text{font-family:'Playfair Display',serif;font-style:italic;font-size:1.25rem;line-height:1.65;position:relative;z-index:1;margin-bottom:1.5rem;color:#f5f0e8;}
.hero-quote-meta{font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-light);}
.hero-scroll-hint{position:absolute;bottom:2rem;left:50%;transform:translateX(-50%);font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:rgba(245,240,232,0.3);display:flex;flex-direction:column;align-items:center;gap:0.5rem;animation:fadeUp 1s 1.2s ease both;}
.scroll-line{width:1px;height:2rem;background:linear-gradient(to bottom,var(--gold),transparent);animation:scrollPulse 2s infinite;}

.marquee-wrap{background:var(--grass);color:var(--gold-light);padding:0.9rem 0;overflow:hidden;white-space:nowrap;}
.marquee-track{display:inline-flex;animation:marquee 30s linear infinite;}
.marquee-item{font-family:'DM Mono',monospace;font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;padding:0 2.5rem;}
.marquee-item::after{content:'C6';margin-left:2.5rem;color:var(--gold);opacity:0.5;}

section{padding:6rem 4rem;}
.section-label{font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:0.8rem;}
.section-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,3.5vw,3rem);font-weight:900;line-height:1.1;letter-spacing:-0.02em;margin-bottom:1rem;color:#f5f0e8;}
.section-rule{width:2.5rem;height:2px;background:var(--gold);margin-bottom:2.5rem;}

.categories{background:#141210;}
.categories-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem;margin-top:3rem;}
.cat-card{background:rgba(255,255,255,0.03);border:1px solid rgba(184,149,90,0.1);padding:2.5rem 2rem;transition:transform 0.2s,box-shadow 0.2s,border-color 0.2s;position:relative;overflow:hidden;}
.cat-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform 0.3s ease;}
.cat-card:hover::before{transform:scaleX(1);}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,0.3);border-color:rgba(184,149,90,0.3);}
.cat-icon{font-size:2rem;margin-bottom:1.2rem;}
.cat-num{font-family:'Playfair Display',serif;font-style:italic;font-size:4rem;font-weight:900;color:rgba(184,149,90,0.08);position:absolute;top:1rem;right:1.5rem;line-height:1;pointer-events:none;}
.cat-title{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;margin-bottom:0.8rem;color:#f5f0e8;}
.cat-desc{font-size:0.88rem;line-height:1.65;color:rgba(245,240,232,0.5);}
.cat-link{display:inline-flex;align-items:center;gap:0.4rem;font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light);text-decoration:none;margin-top:1.5rem;border-bottom:1px solid rgba(184,149,90,0.4);padding-bottom:1px;transition:color 0.2s,border-color 0.2s;cursor:pointer;}
.cat-link:hover{color:var(--gold);border-color:var(--gold);}

.featured{background:#0a0908;}
.featured .section-title,.featured .section-rule{}
.featured-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1.5rem;margin-top:3rem;}
.post-card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);padding:0;transition:transform 0.25s,border-color 0.25s;overflow:hidden;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;}
.post-card:hover{transform:translateY(-3px);border-color:rgba(184,149,90,0.3);}
.post-card-inner{padding:2rem;}
.post-card.large{min-height:340px;}
.post-tag{font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-light);margin-bottom:1rem;}
.post-title{font-family:'Playfair Display',serif;font-weight:700;line-height:1.3;margin-bottom:0.8rem;color:#f5f0e8;}
.post-card.large .post-title{font-size:1.5rem;}
.post-card:not(.large) .post-title{font-size:1.1rem;}
.post-excerpt{font-size:0.88rem;line-height:1.6;color:rgba(245,240,232,0.65);margin-bottom:1.2rem;}
.post-meta{font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.08em;color:rgba(245,240,232,0.4);}

.about{display:grid;grid-template-columns:1fr 1fr;gap:5rem;align-items:center;}

.about-stats{display:flex;gap:2.5rem;margin:2rem 0;padding:2rem 0;border-top:1px solid rgba(184,149,90,0.15);border-bottom:1px solid rgba(184,149,90,0.15);}
.stat-val{font-family:'Playfair Display',serif;font-size:2rem;font-weight:900;color:#f5f0e8;}
.stat-label{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,240,232,0.4);}

.gallery-section{background:#141210;}
.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:2rem;}
.gallery-thumb{position:relative;overflow:hidden;aspect-ratio:1;cursor:pointer;}
.gallery-thumb img{width:100%;height:100%;object-fit:cover;transition:transform 0.4s;filter:grayscale(20%);}
.gallery-thumb:hover img{transform:scale(1.06);filter:grayscale(0%);}
.gallery-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,12,10,0.85) 0%,transparent 50%);display:flex;align-items:flex-end;padding:1rem;opacity:0;transition:opacity 0.3s;}
.gallery-thumb:hover .gallery-thumb-overlay{opacity:1;}
.gallery-thumb-overlay span{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold-light);}

.gallery-full{padding:3rem 4rem 6rem;}
.gallery-masonry{columns:3;gap:1rem;}
.gallery-item{break-inside:avoid;margin-bottom:1rem;position:relative;overflow:hidden;cursor:pointer;}
.gallery-item img{width:100%;display:block;transition:transform 0.4s;filter:grayscale(20%);}
.gallery-item:hover img{transform:scale(1.04);filter:grayscale(0%);}
.gallery-item .gallery-thumb-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(14,12,10,0.85) 0%,transparent 60%);display:flex;align-items:flex-end;padding:1rem;opacity:0;transition:opacity 0.3s;}

.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:999;display:flex;align-items:center;justify-content:center;}

.footer-logo{font-family:'Playfair Display',serif;font-style:italic;font-size:1rem;color:#f5f0e8;}
.footer-logo span{color:var(--gold);}
footer p{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.08em;}
.footer-links{display:flex;gap:1.5rem;}
.footer-links a{font-family:'DM Mono',monospace;font-size:0.65rem;letter-spacing:0.1em;text-transform:uppercase;color:rgba(245,240,232,0.45);text-decoration:none;transition:color 0.2s;}

.page-header{background:#080706;color:#f5f0e8;padding:8rem 4rem 4rem;border-bottom:1px solid rgba(184,149,90,0.1);}

.page-title{font-family:'Playfair Display',serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:900;line-height:1.05;letter-spacing:-0.03em;color:#f5f0e8;}
.back-link{font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold-light);text-decoration:none;transition:color 0.2s;}
.back-link:hover{color:#f5f0e8;}

.list-container{max-width:900px;margin:0 auto;padding:3rem 4rem 6rem;}
.list-card{display:flex;gap:1.5rem;padding:2rem 0;border-bottom:1px solid rgba(184,149,90,0.1);transition:padding-left 0.2s;cursor:pointer;}
.list-card:last-child{border-bottom:none;}
.list-card:hover{padding-left:0.5rem;}
.list-card-img{flex-shrink:0;width:120px;height:120px;overflow:hidden;}
.list-card-img img{width:100%;height:100%;object-fit:cover;filter:grayscale(30%);transition:filter 0.3s;}

.list-card-body{flex:1;}
.list-card-meta{display:flex;align-items:center;gap:1.2rem;margin-bottom:0.8rem;}
.list-card .post-tag{margin-bottom:0;}
.list-date{font-family:'DM Mono',monospace;font-size:0.62rem;letter-spacing:0.08em;color:rgba(245,240,232,0.35);}
.list-title{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700;line-height:1.25;margin-bottom:0.6rem;color:#f5f0e8;}
.list-excerpt{font-size:0.9rem;line-height:1.6;color:rgba(245,240,232,0.5);margin-bottom:0.8rem;}
.empty-msg{font-family:'DM Mono',monospace;font-size:0.8rem;color:rgba(245,240,232,0.4);padding:3rem 0;}

.post-hero{background:#080706;color:#f5f0e8;padding:8rem 4rem 5rem;min-height:50vh;display:flex;align-items:flex-end;}
.post-hero-inner{max-width:760px;}
.post-hero-title{font-family:'Playfair Display',serif;font-size:clamp(2rem,4vw,3.5rem);font-weight:900;line-height:1.1;letter-spacing:-0.025em;color:#f5f0e8;margin:1rem 0 0.8rem;}
.post-hero-date{font-family:'DM Mono',monospace;font-size:0.68rem;letter-spacing:0.12em;color:var(--gold-light);}
.post-body{max-width:760px;margin:0 auto;padding:4rem 4rem 6rem;}
.post-content p{font-size:1.05rem;line-height:1.9;color:rgba(245,240,232,0.85);margin-bottom:1.6rem;}
.more-posts{margin-top:5rem;padding-top:4rem;border-top:1px solid rgba(184,149,90,0.15);}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-top:2rem;}
.more-grid .list-title{font-size:1.1rem;}

@keyframes fadeDown{from{opacity:0;transform:translateY(-12px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes scrollPulse{0%,100%{opacity:1;transform:scaleY(1);}50%{opacity:0.4;transform:scaleY(0.6);}}

@media(max-width:900px){
  nav{padding:1rem 1.5rem;}
  .nav-links{display:none;}
  .hero{grid-template-columns:1fr;min-height:auto;}
  .hero-left{padding:6rem 1.5rem 3rem;}
  .hero-right{padding:2rem 1.5rem 4rem;}
  section{padding:4rem 1.5rem;}
  .categories-grid{grid-template-columns:1fr;}
  .about{grid-template-columns:1fr;gap:2.5rem;}
  .about-photo-frame{max-width:100%;aspect-ratio:4/3;}

  .list-card{flex-direction:column;}
  .list-card-img{width:100%;height:200px;}

  .more-grid{grid-template-columns:1fr;}
  .gallery-grid{grid-template-columns:repeat(2,1fr);}
  .gallery-masonry{columns:2;}
  .gallery-full{padding:2rem 1.5rem 4rem;}
}
</style>
</head>
